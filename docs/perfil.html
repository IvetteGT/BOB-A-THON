<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Directorio de Talentos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>🎯 Directorio de Talentos</h1>
            <nav>
                <a href="index.html" class="btn-nav">← Volver</a>
            </nav>
        </div>
    </header>

    <section class="profile-detail">
        <div class="container">
            <div class="profile-card-detail">
                <!-- Avatar -->
                <div class="profile-header">
                    <div class="avatar-large" id="profileAvatar">JP</div>
                    <h2 id="profileName">Cargando...</h2>
                    <p class="skill-badge" id="profileSkill"></p>
                    <div class="rating-display">
                        <div class="stars" id="profileRating"></div>
                        <span id="ratingCount">(0 valoraciones)</span>
                    </div>
                </div>

                <!-- Información -->
                <div class="profile-info">
                    <h3>📝 Descripción</h3>
                    <p id="profileDescription"></p>

                    <h3>📞 Información de Contacto</h3>
                    <div class="contact-info">
                        <p><strong>📱 Teléfono:</strong> <span id="profilePhone"></span></p>
                        <p><strong>📧 Email:</strong> <span id="profileEmail"></span></p>
                        <p><strong>📍 Barrio:</strong> <span id="profileNeighborhood"></span></p>
                    </div>

                    <!-- Formulario de Calificación -->
                    <div class="rating-form">
                        <h3>⭐ Calificar</h3>
                        <div class="rating-input">
                            <span class="star" data-rating="1" onclick="setRating(1)">☆</span>
                            <span class="star" data-rating="2" onclick="setRating(2)">☆</span>
                            <span class="star" data-rating="3" onclick="setRating(3)">☆</span>
                            <span class="star" data-rating="4" onclick="setRating(4)">☆</span>
                            <span class="star" data-rating="5" onclick="setRating(5)">☆</span>
                        </div>
                        <textarea 
                            id="ratingComment" 
                            placeholder="Comentario (opcional)"
                            rows="3"
                        ></textarea>
                        <button onclick="submitRating()" class="btn-primary">Enviar Calificación</button>
                    </div>

                    <!-- Lista de Calificaciones -->
                    <div class="ratings-list">
                        <h3>💬 Calificaciones</h3>
                        <div id="ratingsList">
                            <!-- Calificaciones se cargan aquí -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- App Scripts -->
    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/data.js"></script>
    <script>
        let currentRating = 0;
        let currentProfileId = null;

        // Cargar perfil al iniciar
        window.onload = async function() {
            await initStorage();
            const urlParams = new URLSearchParams(window.location.search);
            currentProfileId = urlParams.get('id');
            if (currentProfileId) {
                await loadProfile(currentProfileId);
            } else {
                window.location.href = 'index.html';
            }
        };

        async function loadProfile(id) {
            const profile = await getProfileById(id);
            if (!profile) {
                alert('Perfil no encontrado');
                window.location.href = 'index.html';
                return;
            }

            // Cargar datos del perfil
            document.getElementById('profileAvatar').textContent = getInitials(profile.name);
            document.getElementById('profileName').textContent = profile.name;
            document.getElementById('profileSkill').textContent = profile.skill;
            document.getElementById('profileDescription').textContent = profile.description || 'Sin descripción';
            document.getElementById('profilePhone').textContent = profile.phone;
            document.getElementById('profileEmail').textContent = profile.email;
            document.getElementById('profileNeighborhood').textContent = profile.neighborhood;

            // Cargar calificaciones
            await loadRatings(id);
        }

        async function loadRatings(profileId) {
            const ratings = await getRatingsByProfile(profileId);
            const avgRating = calculateAverageRating(ratings);
            
            // Mostrar promedio
            document.getElementById('profileRating').innerHTML = generateStars(avgRating);
            document.getElementById('ratingCount').textContent = `(${ratings.length} valoraciones)`;

            // Mostrar lista de calificaciones
            const ratingsList = document.getElementById('ratingsList');
            if (ratings.length === 0) {
                ratingsList.innerHTML = '<p class="text-muted">Sin calificaciones aún</p>';
            } else {
                ratingsList.innerHTML = ratings.map(r => `
                    <div class="rating-item">
                        <div class="stars">${generateStars(r.rating)}</div>
                        <p>${r.comment || 'Sin comentario'}</p>
                        <small>${formatDate(r.date || r.created_at)}</small>
                    </div>
                `).join('');
            }
        }

        function setRating(rating) {
            currentRating = rating;
            const stars = document.querySelectorAll('.rating-input .star');
            stars.forEach((star, index) => {
                star.textContent = index < rating ? '★' : '☆';
            });
        }

        async function submitRating() {
            if (currentRating === 0) {
                alert('Por favor selecciona una calificación');
                return;
            }

            const comment = document.getElementById('ratingComment').value;
            
            await addRating(currentProfileId, {
                rating: currentRating,
                comment: comment,
                authorName: 'Usuario'
            });

            alert('¡Calificación enviada exitosamente!');
            
            // Recargar calificaciones
            await loadRatings(currentProfileId);
            
            // Limpiar formulario
            currentRating = 0;
            document.getElementById('ratingComment').value = '';
            setRating(0);
        }

        function getInitials(name) {
            return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
        }

        function generateStars(rating) {
            const fullStars = Math.floor(rating);
            const halfStar = rating % 1 >= 0.5;
            let stars = '';
            
            for (let i = 0; i < fullStars; i++) stars += '★';
            if (halfStar) stars += '⯨';
            for (let i = fullStars + (halfStar ? 1 : 0); i < 5; i++) stars += '☆';
            
            return stars;
        }

        function calculateAverageRating(ratings) {
            if (ratings.length === 0) return 0;
            const sum = ratings.reduce((acc, r) => acc + r.rating, 0);
            return sum / ratings.length;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('es-ES', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }
    </script>
</body>
</html>
